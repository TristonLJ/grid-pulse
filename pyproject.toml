[project]
name = "grid-pulse"
version = "0.1.0"
description = "South African electricity grid analysis: Eskom + Ember data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "plotly>=5.22",
    "jupyterlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
